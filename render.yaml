# Render Blueprint taslağı (WBS-6.2, Umut). Henüz denenmedi: ilk deploy'da kontrol edilmeli.
services:
  - type: web
    name: snapfridge-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: snapfridge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: VISION_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false  # Render panelinden girilir, ASLA commit etmeyin
      - key: CORS_ORIGINS
        sync: false  # frontend adresi, Render panelinden girilir
  - type: web
    name: snapfridge-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # backend adresi, ör. https://snapfridge-api.onrender.com

databases:
  - name: snapfridge-db
    plan: free
